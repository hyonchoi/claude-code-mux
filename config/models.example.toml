# Model Mapping Configuration
# Maps external model names to multiple providers with fallback support

# Example: claude-sonnet-4-5 can use multiple providers
[[models]]
name = "claude-sonnet-4-5"  # External model name (used in API requests)

  # Primary provider
  [[models.mappings]]
  priority = 1
  provider = "anthropic-native"
  actual_model = "claude-sonnet-4-5"

  # Fallback provider 1
  [[models.mappings]]
  priority = 2
  provider = "openrouter"
  actual_model = "anthropic/claude-3.5-sonnet"
  # Normalize role:"system" messages from opus/sonnet-5 payloads
  # that OpenRouter targets may reject
  strip_mid_conversation_system = true

# Example: gpt-5.1 mapping
[[models]]
name = "gpt-5.1"

  [[models.mappings]]
  priority = 1
  provider = "openai"
  actual_model = "gpt-5.1"
  # Residual mid-conversation role:"system" entries (from opus/sonnet-5
  # SessionStart hooks) are not valid in OpenAI-format messages
  strip_mid_conversation_system = true

  [[models.mappings]]
  priority = 2
  provider = "openrouter"
  actual_model = "openai/gpt-5.1"
  strip_mid_conversation_system = true

# vLLM Anthropic-compatible provider (self-hosted)
# vLLM 0.8+ supports /v1/messages Anthropic-compatible endpoint natively
[[providers]]
name = "vllm-local"
provider_type = "vllm"
# base_url = "http://localhost:8000"  # Default, override if running on different port/host
# AnthropicCompatibleProvider appends /v1/messages automatically
auth_type = "ApiKey"
api_key = "none"  # Placeholder — self-hosted vLLM typically ignores this
# supported_beta_options = []  # Uncomment to suppress default beta headers (vLLM may not recognize Claude-specific beta flags)
models = ["qwen3.6-27b", "deepseek-r1-32b"]

# SGLang Anthropic-compatible provider (self-hosted)
# SGLang 0.4+ supports /v1/messages Anthropic-compatible endpoint natively
[[providers]]
name = "sglang-local"
provider_type = "sglang"
# base_url = "http://localhost:30000"  # Default, override if running on different port/host
# AnthropicCompatibleProvider appends /v1/messages automatically
auth_type = "ApiKey"
api_key = "none"  # Placeholder — self-hosted SGLang typically ignores this
# supported_beta_options = []  # Uncomment to suppress default beta headers
models = ["qwen3.6-27b", "deepseek-r1-32b"]
