name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check version sources are in sync
        run: |
          # Cargo.toml is the single source of truth; the VERSION file must
          # match so auto-tag.yml (which reads Cargo.toml) can't drift from it.
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ "$CARGO_VERSION" != "$FILE_VERSION" ]]; then
            echo "Error: version mismatch — Cargo.toml=$CARGO_VERSION, VERSION=$FILE_VERSION"
            echo "Keep both in sync (Cargo.toml is the source of truth)."
            exit 1
          fi
          echo "Version sources in sync: $CARGO_VERSION"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy

      - name: Test
        run: cargo test
